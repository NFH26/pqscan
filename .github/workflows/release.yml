name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the version is read from git tags
      - uses: astral-sh/setup-uv@v10.2.0
      - run: uv build
      - name: Check the tag matches the packaged version
        # The version now comes from the tag itself, so this should always pass. It stays as
        # a guard: if the tag was not found, the build gets a .dev version and stops here.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.whl | sed -E 's/.*-([0-9][^-]*)-py3.*/\1/')
          test "$tag" = "$built" || { echo "tag $tag != version $built"; exit 1; }
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with: {name: dist, path: dist/}

  pypi:
    # Trusted publishing: no token stored in the repo. Register the publisher once at
    # https://pypi.org/manage/account/publishing/ (project pqscan, owner NFH26,
    # repository pqscan, workflow release.yml, environment pypi).
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with: {name: dist, path: dist}
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the version is read from git tags
      - uses: actions/download-artifact@v8
        with: {name: dist, path: dist}
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/NFH26/pqscan/blob/main/CHANGELOG.md).
