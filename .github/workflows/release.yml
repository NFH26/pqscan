name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv build
      - name: Check the tag matches the packaged version
        # A release tagged v0.4.0 that ships 0.3.0 is a support problem forever.
        run: |
          tag="${GITHUB_REF_NAME#v}"
          built=$(ls dist/*.whl | sed -E 's/.*-([0-9][^-]*)-py3.*/\1/')
          test "$tag" = "$built" || { echo "tag $tag != version $built"; exit 1; }
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  # No PyPI job. Installation is a clone and `./pqc setup`, which keeps the GitHub page the
  # one place people land. To publish to PyPI later, configure trusted publishing for the
  # project and add a job that runs pypa/gh-action-pypi-publish against this build.
  github-release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v8
        with: {name: dist, path: dist}
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            See [CHANGELOG.md](https://github.com/nayefalharbi/pqscan/blob/main/CHANGELOG.md).
